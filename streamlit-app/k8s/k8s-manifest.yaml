apiVersion: v1
kind: Namespace
metadata:
  name: streamlit-ui
  labels:
    app: streamlit-ui
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamlit-ui-config
  namespace: streamlit-ui
  labels:
    app: streamlit-ui
# Update as needed
data:
  ORCHESTRATOR_API_URL: http://api-orchestrator-svc.api-orchestrator.svc.cluster.local 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-ui
  labels:
    app: streamlit-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamlit-ui
  template:
    metadata:
      labels:
        app: streamlit-ui
    spec:
      containers:
      - name: streamlit-ui
        image: ghcr.io/umlcloudcomputing/unibot-v2-streamlit:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
        envFrom:
        - configMapRef:
            name: streamlit-ui-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: _stcore/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: _stcore/health
            port: 8501
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-ui-svc
  labels:
    app: streamlit-ui
spec:
  selector:
    app: streamlit-ui
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
  type: ClusterIP
