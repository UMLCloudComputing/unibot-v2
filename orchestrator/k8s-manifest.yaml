apiVersion: v1
kind: Secret
metadata:
  name: api-orchestrator-secrets
type: Opaque
data:
  mcp-server-url: aHR0cDovL3VtbC1ub3ctbWNwLXN2Yy5tY3Auc3ZjLmNsdXN0ZXIubG9jYWw6ODAwMC9tY3A=
  milvus-base-url: aHR0cDovL21pbHZ1cy1jbHVzdGVyLW1pbHZ1cy9taWx2dXMtY2x1c3Rlci5zdmMuY2x1c3Rlci5sb2NhbDoxOTUzMA==
  milvus-collection: ZG9jcw==
  ollama-model: Z3B0LW9zczpsYXRlc3Q=
  ollama-base-url: aHR0cDovLzE5Mi4xNjguMS4xNTM6MTE0MzQ=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-orchestrator
  labels:
    app: orchestrator
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/umlcloudcomputing/unibot-v2-api-orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8001
          env:
          - name: MCP_SERVER_BASE_URL
            valueFrom:
                secretKeyRef:
                  name: api-orchestrator-secrets
                  key: mcp-server-url
          - name: MILVUS_BASE_URL
            valueFrom:
                secretKeyRef:
                  name: api-orchestrator-secrets
                  key: milvus-base-url
          - name: MILVUS_COLLECTION
            valueFrom:
                secretKeyRef:
                  name: api-orchestrator-secrets
                  key: milvus-collection
          - name: OLLAMA_MODEL
            valueFrom:
                secretKeyRef:
                  name: api-orchestrator-secrets
                  key: ollama-model
          - name: OLLAMA_BASE_URL
            valueFrom:
                secretKeyRef:
                  name: api-orchestrator-secrets
                  key: ollama-base-url
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-orchestrator-svc
  labels:
    app: api-orchestrator
spec:
  selector:
    app: api-orchestrator
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
---

