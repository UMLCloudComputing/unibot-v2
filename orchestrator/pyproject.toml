[project]
name = "orchestrator"
version = "0.1.0"
description = "The Orchestrator for unibot-v2. Handles tool calling loop and MCP tool integration with the LLM. Exposes a single API endpoint."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.136.1",
  "langchain>=1.3.1",
  "langchain-community>=0.4.1",
  "langchain-mcp-adapters>=0.2.2",
  "langchain-ollama>=1.1.0",
  "prometheus-client>=0.25.0",
]
