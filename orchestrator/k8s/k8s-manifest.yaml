apiVersion: v1
kind: ConfigMap 
metadata:
  name: api-orchestrator-config
data:
  MCP_SERVER_BASE_URL: http://uml-now-mcp-svc.mcp.svc.cluster.local
  MILVUS_COLLECTION: docs
  OLLAMA_MODEL: gpt-oss:latest
  OLLAMA_BASE_URL: http://192.168.1.207:11434 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-orchestrator
  labels:
    app: orchestrator
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/umlcloudcomputing/unibot-v2-api-orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8001
          envFrom:
          - configMapRef:
              name: api-orchestrator-config 
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-orchestrator-svc
  labels:
    app: api-orchestrator
spec:
  selector:
    app: api-orchestrator
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
---

