apiVersion: v1
kind: Namespace
metadata:
  name: api-orchestrator
  labels:
    app: api-orchestrator
---
apiVersion: v1
kind: ConfigMap 
metadata:
  name: api-orchestrator-config
  namespace: api-orchestrator
  labels:
    app: api-orchestrator
data:
  MCP_SERVER_1: uml-now-mcp,http://uml-now-mcp-svc.mcp.svc.cluster.local:8000/mcp
  MCP_SERVER_2: uml-search-mcp,http://uml-serach-mcp-svc.mcp.svc.cluster.local:8000/mcp
  OLLAMA_MODEL: gemma4:12b
  OLLAMA_BASE_URL: http://192.168.1.207:11434 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-orchestrator
  namespace: api-orchestrator
  labels:
    name: api-orchestrator
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: api-orchestrator
  template:
    metadata:
      labels:
        app: api-orchestrator
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/umlcloudcomputing/unibot-v2-orchestrator:latest
          imagePullPolicy: Always
          ports:
          - containerPort: 8001
          envFrom:
          - configMapRef:
              name: api-orchestrator-config 
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-orchestrator-svc
  namespace: api-orchestrator
  labels:
    app: api-orchestrator
spec:
  selector:
    app: api-orchestrator
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
