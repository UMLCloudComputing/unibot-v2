apiVersion: v1
kind: Namespace
metadata:
  name: api-orchestrator
  labels:
    app: api-orchestrator
---
apiVersion: v1
kind: ConfigMap 
metadata:
  name: api-orchestrator-config
  namespace: api-orchestrator
  labels:
    app: api-orchestrator
data:
  OLLAMA_MODEL: gemma4:12b
  OLLAMA_BASE_URL: http://192.168.1.207:11434 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-orchestrator-mcp-config
  namespace: api-orchestrator
  labels:
    app: api-orchestrator
data:
  mcp_servers.json: |
    {
    "mcp_servers": [
        {
          "name": "uml-now-mcp",
          "url": "http://uml-now-mcp-svc.mcp.svc.cluster.local:8000/mcp"
        },
        {
          "name": "uml-search-mcp",
          "url": "http://uml-search-mcp-svc.mcp.svc.cluster.local:8000/mcp"
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-orchestrator
  namespace: api-orchestrator
  labels:
    name: api-orchestrator
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: api-orchestrator
  template:
    metadata:
      labels:
        app: api-orchestrator
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/umlcloudcomputing/unibot-v2-orchestrator:latest
          volumeMounts:
          - name: mcp-config-volume
            mountPath: /app/config
          imagePullPolicy: Always
          ports:
          - containerPort: 8001
            name: http-metrics
          envFrom:
          - configMapRef:
              name: api-orchestrator-config 
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
      - name: mcp-config-volume
        configMap:
          name: api-orchestrator-mcp-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-orchestrator-svc
  namespace: api-orchestrator
  labels:
    app: api-orchestrator
spec:
  selector:
    app: api-orchestrator
  ports:
    - protocol: TCP
      name: http-metrics
      port: 8001
      targetPort: 8001
  type: ClusterIP
