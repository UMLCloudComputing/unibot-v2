apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-orchestrator
  namespace: api-orchestrator
  labels:
    name: api-orchestrator
spec:
  template:
    spec:
      containers:
        - name: orchestrator
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
