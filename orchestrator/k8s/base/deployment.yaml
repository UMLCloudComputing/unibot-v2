apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-orchestrator
  namespace: api-orchestrator
  labels:
    name: api-orchestrator
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: api-orchestrator
  template:
    metadata:
      labels:
        app: api-orchestrator
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/umlcloudcomputing/unibot-v2-orchestrator:latest
          volumeMounts:
          - name: mcp-config-volume
            mountPath: /app/config
          imagePullPolicy: Always
          ports:
          - containerPort: 8001
            name: http-metrics
          envFrom:
          - configMapRef:
              name: api-orchestrator-config 
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz/liveness
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
      - name: mcp-config-volume
        configMap:
          name: api-orchestrator-mcp-config
