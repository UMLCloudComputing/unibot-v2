apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-bot
  namespace: discord-bot
  labels:
    app: discord-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-bot
  template:
    metadata:
      labels:
        app: discord-bot
    spec:
      containers:
      - name: bot
        image: ghcr.io/umlcloudcomputing/unibot-v2-discord-bot:latest
        imagePullPolicy: Always
        env:
        - name: DISCORD_TOKEN
          valueFrom:
            secretKeyRef:
              name: bot-secrets # Not provided in this manifest, must be set manually into the namespace
              key: discord-token 
        envFrom:
        - configMapRef:
            name: discord-bot 
        resources:
          requests:
              memory: "512Mi"
              cpu: "250m"
          limits:
              memory: "1Gi"
              cpu: "500m"
