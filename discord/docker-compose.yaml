services:
  # The Discord Bot Application
  bot:
    build: .
    container_name: discord_bot
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./app:/app/app
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - ORCHESTRATOR_URL=http://localhost:8001/v1/chat # Expects orchestrator to be accessible at `http://localhost:8001` on the host device's network space
      - REDIS_URL=redis://localhost:6379/0
    depends_on:
      - redis

  # Redis for session management and queuing
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:

