apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: unibot-stack
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://github.com/UMLCloudComputing/unibot-v2.git
        targetRevision: HEAD
        path: argocd/apps 
        directory: 
            recurse: true
    destination: 
        name: admin@unibot-cluster
        namespace: argocd
    syncPolicy:
        syncOptions:
            - CreateNamespace=true
        automated:
            prune: true
            selfHeal: true

