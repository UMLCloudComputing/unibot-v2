apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: unibot-stack
    namespace: argocd
spec:
    project: default
    source:
        repoUrl: https://github.com/UMLCloudComputing/unibot-v2.git
        targetRevision: HEAD
        path: argocd/apps 
    destination: 
        server: https://kubernetes.default.svc
        namespace: unibot-stack
    syncPolicy:
        syncOptions:
            - CreateNamespace=true
        automated:
            prune: true
            selfHeal: true

