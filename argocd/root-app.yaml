apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
    name: unibot-v2
    namespace: argocd
    finalizers:
        - resources-finalizer.argocd.argoproj.io
    annotations:
        argocd.argoproj.io/sync-wave: "-10"
spec: 
    sourceRepos:
        - 'https://charts.jetstack.io'
        - 'https://github.com/UMLCloudComputing/unibot-v2.git'
        - 'https://zilliztech.github.io/milvus-operator/'
    destinations:
        - namespace: 'milvus-cluster'
          server: 'https://kubernetes.default.svc'
        - namespace: 'argocd'
          server: 'https://kubernetes.default.svc' 
        - namespace: 'cert-manager'
          server: 'https://kubernetes.default.svc' 
        - namespace: 'milvus-operator'
          server: 'https://kubernetes.default.svc' 
        - namespace: 'kube-system'
          server: 'https://kubernetes.default.svc' 
    clusterResourceWhitelist:
        - group: '*'
          kind: '*' 
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: unibot-stack
    namespace: argocd
spec:
    project: unibot-v2
    source:
        repoURL: https://github.com/UMLCloudComputing/unibot-v2.git
        targetRevision: HEAD
        path: argocd/apps
    destination: 
        server: https://kubernetes.default.svc
        namespace: argocd
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
            allowEmpty: true

