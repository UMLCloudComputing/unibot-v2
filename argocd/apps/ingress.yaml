apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unibot-ingress
  namespace: argocd
spec:
  project: unibot-v2
  source:
    repoURL: https://github.com/UMLCloudComputing/unibot-v2.git
    targetRevision: HEAD
    path: argocd/apps/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true

