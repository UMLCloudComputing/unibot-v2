apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streamlit
  namespace: argocd
spec:
  project: unibot-v2
  source:
    repoURL: https://github.com/UMLCloudComputing/unibot-v2.git
    targetRevision: main
    path: streamlit/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: streamlit-ui
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
