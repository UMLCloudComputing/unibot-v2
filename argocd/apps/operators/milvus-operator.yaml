apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: milvus-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://zilliztech.github.io/milvus-operator/'
    chart: milvus-operator
    targetRevision: 0.9.x # Use the latest stable version
    helm:
        values: |
            admissionWebhooks:
                enabled: true
                certManager:
                    enabled: true
            resources:
                limits:
                    cpu: 200m
                    memory: 512Mi
                requests:
                    cpu: 100m
                    memory: 256Mi 
  destination:
    server: https://kubernetes.default.svc
    namespace: milvus-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
