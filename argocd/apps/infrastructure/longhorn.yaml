apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    chart: longhorn
    repoURL: https://charts.longhorn.io
    targetRevision: 1.11.x
    helm:
      values: |
        persistence:
          defaultClass: true
        defaultSettings:
          defaultDataPath: /var/lib/longhorn
          storageReservedPercentageForDefaultDataPath: 15
        preUpgradeChecker:
          jobEnabled: false
        upgradeVersionCheck: false
  destination:
    server: https://kubernetes.default.svc 
    namespace: longhorn-system 
  syncPolicy:
    syncOptions:
        - CreateNamespace=true
        - SkipDryRunOnMissingResource=true
    automated:
        prune: true
        selfHeal: true
