apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openwebui-gateway
  namespace: openwebui
spec:
  gatewayClassName: envoy-gateway-class 
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: internal-proxy-config
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same

