apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: streamlit-ui-route
  namespace: streamlit-ui
spec:
  parentRefs:
  - name: streamlit-ui-gateway
  rules:
  - matches:
    - path: 
        type: PathPrefix
        value: /
    backendRefs:
    - name: streamlit-ui-svc
      port: 8501
    sessionPersistence:
      sessionName: UNIBOT-UI-SESSIONS
      type: Cookie
      cookieConfig:
        lifetimeType: Session

