apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openwebui-route
  namespace: openwebui
spec:
  parentRefs:
  - name: openwebui-gateway
    namespace: openwebui
    sectionName: http 
  rules:
  # 1. Specific Rule for LLM API (Extended Timeouts)
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: openwebui-open-webui
      port: 80
    timeouts:
      request: 300s
      backendRequest: 300s

  # 2. General Rule for Frontend (Default Timeouts)
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: openwebui-open-webui
      port: 80
    sessionPersistence:
      sessionName: OPEN_WEBUI_SESSIONS
      type: Cookie
      cookieConfig:
        lifetimeType: Session
