apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: milvus-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: unibot-v2
  source:
    repoURL: 'https://zilliztech.github.io/milvus-operator/'
    chart: milvus-operator
    targetRevision: 1.3.6 # Use the latest stable version
    helm:
        values: |
            admissionWebhooks:
                enabled: true
                certManager:
                    enabled: true
            resources:
                limits:
                    cpu: 200m
                    memory: 512Mi
                requests:
                    cpu: 100m
                    memory: 256Mi 
  destination:
    server: https://kubernetes.default.svc
    namespace: milvus-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
