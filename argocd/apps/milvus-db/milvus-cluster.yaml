apiVersion: v1
kind: Namespace
metadata:
    name: milvus-cluster
    labels:
        pod-security.kubernetes.io/enforce: baseline # Change if needed
---
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: milvus-cluster
  namespace: milvus-cluster 
  labels:
    app: milvus
spec:
  mode: cluster
  components:
    mixCoord:
      replicas: 1
      resources:
        limits:
          cpu: 1
          memory: 2Gi
    streamingNode:
      replicas: 1
      resources:
        limits:
          cpu: 1 
          memory: 2Gi
    proxy:
      replicas: 1
      resources:
        limits:
          cpu: 1
          memory: 2Gi
    queryNode:
      replicas: 1
      resources:
        limits:
          cpu: 1 
          memory: 2Gi
    dataNode:
      replicas: 1
      resources:
        limits:
          cpu: 1 
          memory: 2Gi
  config: {}
  dependencies:

    msgStreamType: woodpecker
  
    etcd:
      inCluster:
        values:
          autoCompactionMode: revision
          autoCompactionRetention: "1000"
          extraEnvVars:
          - name: ETCD_QUOTA_BACKEND_BYTES
            value: "4294967296"
          - name: ETCD_HEARTBEAT_INTERVAL
            value: "500"
          - name: ETCD_ELECTION_TIMEOUT
            value: "25000"
          - name: ETCD_SNAPSHOT_COUNT
            value: "10000"
          - name: ETCD_ENABLE_PPROF
            value: "true"
          persistence:
            accessMode: ReadWriteOnce
            enabled: true
            size: 20Gi   #SSD Required
            storageClass:
          replicaCount: 2 
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 1
              memory: 1Gi
    
    storage:
      inCluster:
        values:
          mode: distributed
          resources:
            limits:
              cpu: 1
              memory: 2Gi
          persistence:
            storageClass:
            accessMode: ReadWriteOnce
            size: 30Gi
  
