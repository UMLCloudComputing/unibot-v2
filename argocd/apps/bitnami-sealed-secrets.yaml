apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: unibot-v2
  source:
    repoURL: https://bitnmai-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      releaseName: sealed-secrets
      values: |
        fullnameOverride: sealed-secrets-controller
        resources:
          requests: 
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 100m

          # Key renewal interval (30 days)
          keyrenewperiod: "720h"

          # Metrics for monitoring
          metrics:
            serviceMonitor:
              enabled: true
    destination:
      server: https://kubernetes.default.svc
      namespace: kube-system
    syncPolicy:
      automated:
        selfHeal: true
        prune: true
      syncOptions:
        - CreateNamespace=true
