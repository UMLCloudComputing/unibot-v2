apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: discord-bot
  namespace: argocd
  # Temporarily disable sync
  annotations:
    argocd.argoproj.io/skip-reconcile: "true"
spec:
  project: unibot-v2
  source:
    repoURL: https://github.com/UMLCloudComputing/unibot-v2.git
    targetRevision: main
    path: discord/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: discord-bot
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
