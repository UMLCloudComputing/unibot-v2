apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: unibot-prometheus
  namespace: monitoring
  labels:
    prometheus: unibot-prometheus
spec:
  replicas: 2
  serviceAccountName: orchestrator-sa

  serviceMonitorSelector:
    matchLabels:
      app: api-orchestrator

  podMonitorSelector:
    matchLabels:
      app: api-orchestrator

  serviceMonitorNamespaceSelector:
    matchNames:
      - api-orchestrator

  retention: 10d
  resources:
    requests:
      memory: 400Mi
    limits:
      memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-unibot-svc
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  selector:
    prometheus: unibot-prometheus
