apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: unibot-v2
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 12.7.1
    helm:
      values: |
        additionalDataSources:
          - name: Prometheus
            type: Prometheus
            access: proxy
            url: http://prometheus-unibot-svc.monitoring.svc.cluster.local:9090
            jsonData:
              httpMethod: POST
              manageAlerts: true
            isDefault: true
  destination: 
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
