apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: unibot-management
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io 
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.13.0 # Lock this to a specific version for stability
    helm:
      values: |
        installCRDs: true
        replicaCount: 2
        resources:
            requests:
                cpu: 10m
                memory: 32Mi
      parameters:
        - name: installCRDs
          value: "true" # Critical: Cert-Manager needs its CRDs to function
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
