apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: redis
    namespace: argocd
    annotations: 
        argocd.argoproj.io/sync-wave: "10"
spec:
    project: unibot-v2
    source:
        chart: redis
        repoURL: registry-1.docker.io/bitnamicharts 
        targetRevision: 25.x.x
        helm:
            values: |
                  primary:
                    resources:
                      limits:
                        cpu: "1"
                        memory: "2Gi"
                  image: 
                    tag: latest 
                  tls:
                    enabled: true
                    existingSecret: certificates-tls-secret
                    certFilename: tls.crt
                    certKeyFilename: tls.key
                    certCAFilename: ca.crt
    destination:
        server: 'https://kubernetes.default.svc'
        namespace: redis 
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
