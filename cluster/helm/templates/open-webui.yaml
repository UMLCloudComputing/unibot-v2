apiVersion: v1
kind: Namespace
metadata:
    name: open-webui
    labels:
        pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:latest
          ports:
            - containerPort: {{ .Values.openWebUi.containerPort }}
          env:
            - name: OLLAMA_BASE_URL
              value: https://192.168.0.73:11434
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: WEBAUI_AUTH
              value: "False"
            - name: ENABLE_EVALUATION_ARENA_MODELS
              value: "False"
#            - name: VECTOR_DB
#              value: "milvus" 
#            - name: RAG_EMBEDDING_ENGINE
#              value: "ollama"
#            - name: RAG_EMBEDDING_MODEL
#              value: "nomic-embed-text"

---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
spec:
  selector:
    app: open-webui
  ports:
    - protocol: TCP
      port: 80
      targetPort: {{ .Values.openWebUi.containerPort }}
      name: http
  type: NodePort

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
spec:
  ports: 
    - port: 80 
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama-service
subsets:
  - addresses:
      - ip: {{ .Values.ollama.ipAddr }}
    ports: 
      - port: 11434 

