services:
  streamlit-app:  
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unibot-v2-streamlit
    network_mode: "host"
    ports:
      - "8501:8501"  
    environment:
      # Match the environment variables to your custom stack initialization defaults
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - ORCHESTRATOR_API_URL=http://localhost:8001/v1/chat

    # Restarts the container if a connection drops temporarily during boot sequences
    restart: on-failure
