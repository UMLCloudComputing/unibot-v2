apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-ui
  namespace: streamlit-ui
  labels:
    app: streamlit-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamlit-ui
  template:
    metadata:
      labels:
        app: streamlit-ui
    spec:
      containers:
      - name: streamlit-ui
        image: ghcr.io/umlcloudcomputing/unibot-v2-streamlit:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
        envFrom:
        - configMapRef:
            name: streamlit-ui-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: _stcore/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: _stcore/health
            port: 8501
          initialDelaySeconds: 5
          periodSeconds: 5
