[project] 
name = "rag-scripts"
version = "0.1.0"
description = "Dependencies for RAG ETL Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "ollama>=0.6.1",
    "pymilvus>=2.6.6",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "matplotlib>=3.10.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "pytest-memray>=1.8.0",
]
[tool.pytest.ini_options]
testpaths=["tests"]
python_files=["*.py"]
python_functions=["test_*", "verify_*"]
addopts="--ignore=volumes"
